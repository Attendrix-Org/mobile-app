  android: 'launcher_icon'
  ios: true
  web:
    generate: true
  image_path: 'assets/images/app_launcher_icon.png'
  adaptive_icon_background: '#7b6ff8'
  adaptive_icon_foreground: 'assets/images/adaptive_foreground_icon.png'


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/

    - assets/environment_values/
  fonts:
    - family: TablerIconsFilled
      fonts:
        - asset: assets/fonts/tabler-icons-filled.ttf
    - family: TablerIconsOutline
      fonts:
        - asset: assets/fonts/tabler-icons-outline.ttf
    - family: PhosphorIconsRegularAppgenz
      fonts:
        - asset: assets/fonts/phosphor-icons-regular-appgenz.ttf
    - family: BoxiconsLogosAppgenz
      fonts:
        - asset: assets/fonts/boxicons-logos-appgenz.ttf
    - family: BasiconsAppgenz
      fonts:
        - asset: assets/fonts/basicons-appgenz.ttf
    - family: HugeIconsSolidAppgenz
      fonts:
        - asset: assets/fonts/huge-icons-solid-appgenz.ttf
    - family: BoxiconsSolidAppgenz
      fonts:
        - asset: assets/fonts/boxicons-solid-appgenz.ttf
    - family: PhosphorIconsBoldAppgenz
      fonts:
        - asset: assets/fonts/phosphor-icons-bold-appgenz.ttf
    - family: CoolIconsAppgenz
      fonts:
        - asset: assets/fonts/cool-icons-appgenz.ttf


