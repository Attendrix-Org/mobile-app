name: Attendrix CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  JAVA_VERSION: "17"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Secret Scan (fastest gate — must pass before anything else)
  # ─────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for diff-based scanning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run secret scanner
        run: python3 scripts/audit_secrets.py

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Format & Analyze
  # ─────────────────────────────────────────────────────────────────────────
  analyze:
    name: Format Check & Static Analysis
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify pubspec.lock is committed and up to date
        run: |
          if [ ! -f pubspec.lock ]; then
            echo "pubspec.lock is missing. Commit it to the repository."
            exit 1
          fi
          flutter pub get
          if ! git diff --exit-code pubspec.lock; then
            echo "pubspec.lock is out of sync with pubspec.yaml. Run 'flutter pub get' and commit the result."
            exit 1
          fi

      - name: Create placeholder .env
        run: touch .env

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Check for auto-fixable issues
        run: dart fix --dry-run

      - name: Run static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3: Unit & Widget Tests with Coverage
  # ─────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create placeholder .env
        run: touch .env

      - name: Run unit and widget tests with coverage
        run: flutter test --coverage --reporter=github

      - name: Enforce coverage threshold (80%)
        run: |
          sudo apt-get update && sudo apt-get install -y lcov bc
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)')
          echo "Line coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage $COVERAGE% is below the required 80% threshold."
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4: Integration Tests on Android Emulator
  # ─────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (Android Emulator)
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create placeholder .env
        run: touch .env

      - name: Enable KVM (for hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests on emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: Nexus 6
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: flutter test -d "$(flutter devices | grep emulator | head -1 | awk '{print $1}')" integration_test/app_test.dart --reporter=compact

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 5: Dependency CVE Audit
  # ─────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency CVE Audit
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create placeholder .env
        run: touch .env

      - name: Run dependency audit (CVE scan + outdated check)
        run: python3 scripts/dependency_audit.py

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 6: Android Build Verification
  # ─────────────────────────────────────────────────────────────────────────
  build-android:
    name: Android Build Verification
    runs-on: ubuntu-latest
    needs: [unit-tests, dependency-audit]
    env:
      NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create placeholder .env
        run: touch .env

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Android release APK
        if: github.event_name == 'push'
        run: |
          flutter build apk \
            --release \
            --dart-define=NASA_API_KEY="${NASA_API_KEY}" \
            --obfuscate \
            --split-debug-info=build/debug-info/

      - name: Verify and Upload APKs
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "❌ Debug APK not found!"
            exit 1
          fi
          echo "✅ Debug APK size: $(du -sh build/app/outputs/flutter-apk/app-debug.apk | cut -f1)"
          
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
              echo "❌ Release APK not found!"
              exit 1
            fi
            echo "✅ Release APK size: $(du -sh build/app/outputs/flutter-apk/app-release.apk | cut -f1)"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload debug info (for deobfuscation)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: debug-info
          path: build/debug-info/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 7: Web Release Build Verification
  # ─────────────────────────────────────────────────────────────────────────
  build-web:
    name: Web Release Build
    runs-on: ubuntu-latest
    needs: [unit-tests, dependency-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create placeholder .env
        run: touch .env

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Build web
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 8: Release Readiness Report
  # ─────────────────────────────────────────────────────────────────────────
  release-readiness:
    name: Release Readiness Report
    runs-on: ubuntu-latest
    needs: [unit-tests, dependency-audit]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create placeholder .env
        run: touch .env

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/

      - name: Run release readiness audit (skip tests — already run above)
        run: |
          python3 scripts/release_readiness_audit.py \
            --skip-tests \
            --skip-deps
