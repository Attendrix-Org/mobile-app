name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
      should_release: ${{ steps.compare.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: extract
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from pubspec.yaml"
            exit 1
          fi
          TAG="v${VERSION//+/-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.extract.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true

      - name: Restore debug keystore
        run: |
          if [ -z "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > android/debug.keystore
          keytool -list -keystore android/debug.keystore -storepass android > /dev/null || {
            echo "::error::Decoded keystore is invalid — check the secret's contents."
            exit 1
          }

      - run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --split-debug-info=build/debug-info \
            --obfuscate

      - name: Verify signature and generate checksum
        run: |
          cd build/app/outputs/flutter-apk
          echo "--- Signer fingerprint ---"
          keytool -printcert -jarfile app-release.apk | grep -A1 "SHA256:"
          sha256sum app-release.apk | tee app-release.apk.sha256

      - name: Zip debug symbols
        run: cd build && zip -r debug-info.zip debug-info

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: Attendrix ${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
            build/debug-info.zip
