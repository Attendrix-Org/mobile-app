name: CI — Validate, Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FLUTTER_VERSION: "3.32.0"
  JAVA_VERSION: "17"
  # NASA_API_KEY is injected at runtime from GitHub Actions secrets.
  # Never hardcode credentials here.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Secret Scan (fastest gate — must pass before anything else)
  # ─────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for diff-based scanning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run secret scanner
        run: python3 scripts/audit_secrets.py

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Format & Analyze
  # ─────────────────────────────────────────────────────────────────────────
  analyze:
    name: Format Check & Static Analysis
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Run static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3: Unit & Widget Tests with Coverage
  # ─────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run unit and widget tests with coverage
        run: flutter test --coverage --reporter=github

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4: Integration Tests on Android Emulator
  # ─────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (Android Emulator)
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Enable KVM (for hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests on emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: Nexus 6
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            flutter test integration_test/app_test.dart \
              --reporter=compact \
              -d "$(flutter devices | grep emulator | head -1 | awk '{print $1}')"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 5: Dependency CVE Audit
  # ─────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency CVE Audit
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run dependency audit (CVE scan + outdated check)
        run: python3 scripts/dependency_audit.py

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 6: Android Release Build Validation
  # (only on push to main/develop — not on every PR to save CI time)
  # ─────────────────────────────────────────────────────────────────────────
  build-android:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: [unit-tests, dependency-audit]
    if: github.event_name == 'push'
    env:
      NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android release APK
        run: |
          flutter build apk \
            --release \
            --dart-define=NASA_API_KEY="${NASA_API_KEY}" \
            --obfuscate \
            --split-debug-info=build/debug-info/

      - name: Verify APK artifact exists
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "❌ Release APK not found!"
            exit 1
          fi
          echo "✅ APK size: $(du -sh build/app/outputs/flutter-apk/app-release.apk | cut -f1)"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload debug info (for deobfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: debug-info
          path: build/debug-info/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 7: Release Readiness Report (final aggregation)
  # ─────────────────────────────────────────────────────────────────────────
  release-readiness:
    name: Release Readiness Report
    runs-on: ubuntu-latest
    needs: [unit-tests, dependency-audit]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/

      - name: Run release readiness audit (skip tests — already run above)
        run: |
          python3 scripts/release_readiness_audit.py \
            --skip-tests \
            --skip-deps
